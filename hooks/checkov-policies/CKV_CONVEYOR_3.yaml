metadata:
  id: "CKV_CONVEYOR_3"
  name: "Ensure Cognito authentication is configured for Conveyor Belt"
  category: "IAM"
  guideline: "API Gateways should use Cognito authentication. Ensure cognito_user_pool_arns is set when routes use auth: cognito."

scope:
  provider: "conveyor-belt"

definition:
  cond_type: "attribute"
  resource_types:
    - "conveyor_belt"
  attribute: "cognito_user_pool_arns"
  operator: "is_not_empty"
